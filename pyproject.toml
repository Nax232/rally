[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sipre"
version = "0.1.0"
description = "SIPRE: infraestructura de prototipo académico SIMULATED"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.136,<0.137",
    "uvicorn>=0.34,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
engines = ["numpy>=2,<3", "ortools>=9.15,<9.16", "networkx>=3.5,<4"]
gis = ["networkx>=3.5,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pytest-cov>=6,<8", "ruff>=0.11,<1", "pyyaml>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra --strict-markers"
markers = ["integration: requires explicit disposable PostgreSQL/PostGIS database URLs"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.uv]
required-version = ">=0.12,<0.13"
